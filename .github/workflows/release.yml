name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  site-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm audit --audit-level=high
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm test
        working-directory: site

  build:
    needs: site-preflight
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            runner: macos-15
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            runner: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - name: Verify exact source tests
        shell: bash
        run: |
          set -o pipefail
          cargo test --workspace --all-features --locked 2>&1 | tee release-rust-tests.log
      - name: Verify exact frontend source and embedded build
        shell: bash
        run: |
          set -o pipefail
          npm ci --prefix ui 2>&1 | tee release-ui-tests.log
          npm --prefix ui run check 2>&1 | tee -a release-ui-tests.log
          npm --prefix ui run build 2>&1 | tee -a release-ui-tests.log
          git diff --exit-code -- ui/dist
      - run: cargo build --release --locked --target ${{ matrix.target }} -p structtrace-cli
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf structtrace-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release structtrace
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive target/${{ matrix.target }}/release/structtrace.exe structtrace-${{ matrix.target }}.zip
      - name: Write SHA-256 checksum
        shell: bash
        run: |
          asset="structtrace-${{ matrix.target }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          artifact-name: structtrace-${{ matrix.target }}.spdx.json
          output-file: structtrace-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: Bind exact source archive
        shell: bash
        run: git archive --format=tar HEAD > structtrace-source-${{ matrix.target }}.tar
      - name: Extract and smoke-test final package
        shell: bash
        run: |
          python scripts/validate-release-archive.py \
            --archive "structtrace-${{ matrix.target }}.${{ matrix.archive }}" \
            --target "${{ matrix.target }}" \
            --source-commit "${{ github.sha }}" \
            --sbom "structtrace-${{ matrix.target }}.spdx.json" \
            --source-archive "structtrace-source-${{ matrix.target }}.tar" \
            --ui-lock ui/package-lock.json \
            --frontend-dist ui/dist \
            --test-log release-rust-tests.log \
            --test-log release-ui-tests.log \
            --evidence "structtrace-${{ matrix.target }}.release-evidence.json"
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: structtrace-${{ matrix.target }}.${{ matrix.archive }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            structtrace-${{ matrix.target }}.${{ matrix.archive }}
            structtrace-${{ matrix.target }}.${{ matrix.archive }}.sha256
            structtrace-${{ matrix.target }}.spdx.json
            structtrace-${{ matrix.target }}.release-evidence.json
            structtrace-source-${{ matrix.target }}.tar
            release-rust-tests.log
            release-ui-tests.log

  publish-installers:
    needs: [site-preflight, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - run: sh -n install.sh
      - name: Write installer checksums
        run: |
          sha256sum install.sh > install.sh.sha256
          sha256sum install.ps1 > install.ps1.sha256
      - name: Attest installer provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: |
            install.sh
            install.ps1
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            install.sh
            install.sh.sha256
            install.ps1
            install.ps1.sha256
