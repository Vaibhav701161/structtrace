version: 1
project:
  name: invoice-extraction-migration
  description: Stable-contract migration from baseline-model-v1 to candidate-model-v2
dataset: {path: data/golden.jsonl, format: jsonl}
schema: {path: schemas/output.schema.json}
variants:
  baseline: {kind: recorded, path: outputs/baseline.jsonl}
  candidate: {kind: recorded, path: outputs/candidate.jsonl}
evaluators:
  - id: identity_fields
    kind: json_pointers_exact
    pointers:
      - {pointer: /invoice_number, expected_pointer: /invoice_number}
      - {pointer: /vendor_name, expected_pointer: /vendor_name}
      - {pointer: /invoice_date, expected_pointer: /invoice_date}
  - {id: currency, kind: enum_accuracy, pointer: /currency, expected_pointer: /currency}
  - {id: subtotal, kind: numeric_tolerance, pointer: /subtotal, expected_pointer: /subtotal, absolute: "0.01", exact_integer: false}
  - {id: tax, kind: numeric_tolerance, pointer: /tax, expected_pointer: /tax, absolute: "0.01", exact_integer: false}
  - {id: total, kind: numeric_tolerance, pointer: /total, expected_pointer: /total, absolute: "0.01", exact_integer: false}
  - {id: line_items, kind: json_pointer_exact, pointer: /line_items, expected_pointer: /line_items}
  - {id: completeness, kind: required_fields, pointers: [/invoice_number, /vendor_name, /invoice_date, /currency, /subtotal, /tax, /total, /line_items]}
outcomes:
  extraction_correct: {all_of: [identity_fields, currency, subtotal, tax, total, line_items, completeness]}
analysis:
  primary_outcome: extraction_correct
  bootstrap: {samples: 10000, confidence: 0.95, seed: 17}
gate: {min_cases: 100, min_primary_scored_rate: 0.99, max_primary_evaluator_error_rate: 0.01, max_primary_not_applicable_rate: 0, max_primary_unscored_rate: 0, max_primary_regression_pp: 0, min_candidate_schema_validity: 1.0}
