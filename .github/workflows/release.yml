name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p structtrace-cli
      - name: Smoke-test static Linux binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/structtrace --version
          target/${{ matrix.target }}/release/structtrace doctor --format json
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf structtrace-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release structtrace
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive target/${{ matrix.target }}/release/structtrace.exe structtrace-${{ matrix.target }}.zip
      - name: Write SHA-256 checksum
        shell: bash
        run: |
          asset="structtrace-${{ matrix.target }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          artifact-name: structtrace-${{ matrix.target }}.spdx.json
          output-file: structtrace-${{ matrix.target }}.spdx.json
          upload-artifact: false
      - name: Attest build provenance
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45 # v2
        with:
          subject-path: structtrace-${{ matrix.target }}.${{ matrix.archive }}
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: |
            structtrace-${{ matrix.target }}.${{ matrix.archive }}
            structtrace-${{ matrix.target }}.${{ matrix.archive }}.sha256
            structtrace-${{ matrix.target }}.spdx.json
