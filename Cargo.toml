[workspace]
members = [
  "crates/structtrace-core",
  "crates/structtrace-engine",
  "crates/structtrace-adapters",
  "crates/structtrace-report",
  "crates/structtrace-cli",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.87"
license = "MIT"
authors = ["Vaibhav Mittal"]
repository = "https://github.com/Vaibhav701161/structtrace"

[workspace.dependencies]
anyhow = "1.0.100"
axum = "0.8.6"
blake3 = "1.8.2"
clap = { version = "4.6.6", features = ["derive", "env", "wrap_help"] }
futures = "0.3.31"
jsonschema = { version = "0.49.7", default-features = false, features = ["arbitrary-precision"] }
minijinja = { version = "2.12.0", features = ["json"] }
open = "5.3.2"
proptest = "1.11.0"
rand = "0.9.2"
rand_chacha = "0.9.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rusqlite = { version = "0.39.0", default-features = false, features = ["bundled"] }
rust_decimal = { version = "1.42.1", features = ["serde-with-str"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.145", features = ["arbitrary_precision", "preserve_order"] }
serde_yaml_ng = "0.10.0"
tempfile = "3.23.0"
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.6.6", features = ["fs", "trace"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "fmt"] }
ulid = { version = "1.2.1", features = ["serde"] }
url = "2.5.7"
wait-timeout = "0.2.1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
