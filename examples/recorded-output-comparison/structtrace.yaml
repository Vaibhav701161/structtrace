version: 3
project: {name: recorded-output-example}
dataset: {path: data/golden.jsonl, format: jsonl}
schema: {path: schemas/output.schema.json}
variants:
  baseline: {kind: recorded, path: outputs/baseline.jsonl}
  candidate: {kind: recorded, path: outputs/candidate.jsonl}
evaluators:
  - {id: label, kind: enum_accuracy, pointer: /label, expected_pointer: /label}
outcomes:
  semantic_correct: {all_of: [label]}
analysis:
  primary_outcome: semantic_correct
  bootstrap: {samples: 10000, confidence: 0.95, seed: 17}
gate: {mode: regression, min_cases: 100, min_unique_cases: 100, max_duplicate_case_rate: 0.01, min_primary_fully_evaluated_rate: 0.99, max_primary_component_error_rate: 0.01, max_primary_component_not_applicable_rate: 0, max_primary_component_unscored_rate: 0, max_primary_regression_pp: 0, max_valid_but_wrong_increase_pp: 0}
