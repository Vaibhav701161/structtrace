name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --all-features --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: "0.4.43"
      - run: mdbook build

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --path crates/structtrace-cli --locked
      - run: structtrace --help
      - run: structtrace doctor
      - run: structtrace demo support-ticket
      - run: structtrace demo research
      - run: structtrace replay --accepted-research
      - run: structtrace --project-root examples/recorded-output-comparison run
      - name: Deliberate gate regression returns 10
        shell: bash
        run: |
          set +e
          structtrace --project-root examples/recorded-output-comparison gate latest --format github
          code=$?
          test "$code" -eq 10
      - run: structtrace --project-root examples/python-callable run
      - run: structtrace --project-root examples/command run
      - run: structtrace --project-root examples/document-extraction run
      - run: structtrace --project-root examples/tool-calling run
