name: Exact-source scale validation

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  recorded-output-10000:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --release --workspace --locked
      - name: Measure complete run, replay, history, and indexed case search
        run: |
          python3 scripts/measure-recorded-scale.py \
            --cases 10000 \
            --output target/scale-validation/result.json
      - name: Verify receipt is bound to this exact source
        env:
          EXPECTED_COMMIT: ${{ github.sha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          receipt = json.loads(Path("target/scale-validation/result.json").read_text())
          assert receipt["source_commit"] == os.environ["EXPECTED_COMMIT"]
          assert receipt["source_worktree_clean"] is True
          assert receipt["passed"] is True
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: structtrace-scale-${{ github.sha }}
          path: target/scale-validation/result.json
          if-no-files-found: error
          retention-days: 30
