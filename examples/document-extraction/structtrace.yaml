version: 3
project:
  name: invoice-extraction-migration
  description: Stable-contract migration from baseline-model-v1 to candidate-model-v2
dataset: {path: data/golden.jsonl, format: jsonl}
schema: {path: schemas/output.schema.json}
variants:
  baseline: {kind: recorded, path: outputs/baseline.jsonl}
  candidate: {kind: recorded, path: outputs/candidate.jsonl}
evaluators:
  - id: identity_fields
    kind: json_pointers_exact
    pointers:
      - {pointer: /invoice_number, expected_pointer: /invoice_number}
  - {id: vendor, kind: normalized_string, pointer: /vendor_name, expected_pointer: /vendor_name, case_insensitive: true}
  - {id: date, kind: canonical_date, pointer: /invoice_date, expected_pointer: /invoice_date, formats: [iso]}
  - {id: currency, kind: enum_accuracy, pointer: /currency, expected_pointer: /currency}
  - {id: subtotal, kind: numeric_tolerance, pointer: /subtotal, expected_pointer: /subtotal, absolute: "0.01", exact_integer: false}
  - {id: tax, kind: numeric_tolerance, pointer: /tax, expected_pointer: /tax, absolute: "0.01", exact_integer: false}
  - {id: total, kind: numeric_tolerance, pointer: /total, expected_pointer: /total, absolute: "0.01", exact_integer: false}
  - id: line_items
    kind: keyed_array
    pointer: /line_items
    expected_pointer: /line_items
    keys: [/description]
    fields:
      - {pointer: /description, evaluator: normalized_string, case_insensitive: true}
      - {pointer: /quantity, evaluator: exact_integer}
      - {pointer: /unit_price, evaluator: decimal_tolerance, absolute: "0.01"}
      - {pointer: /amount, evaluator: decimal_tolerance, absolute: "0.01"}
  - {id: financial_consistency, kind: financial_invariants, line_items_pointer: /line_items, subtotal_pointer: /subtotal, tax_pointer: /tax, total_pointer: /total, absolute: "0.01"}
  - {id: completeness, kind: required_fields, pointers: [/invoice_number, /vendor_name, /invoice_date, /currency, /subtotal, /tax, /total, /line_items]}
outcomes:
  extraction_correct: {all_of: [identity_fields, vendor, date, currency, subtotal, tax, total, line_items, financial_consistency, completeness]}
analysis:
  primary_outcome: extraction_correct
  bootstrap: {samples: 10000, confidence: 0.95, seed: 17}
gate: {mode: regression, min_cases: 100, min_unique_cases: 100, max_duplicate_case_rate: 0.01, min_primary_fully_evaluated_rate: 0.99, max_primary_component_error_rate: 0.01, max_primary_component_not_applicable_rate: 0, max_primary_component_unscored_rate: 0, max_primary_regression_pp: 0, min_candidate_schema_validity: 1.0}
