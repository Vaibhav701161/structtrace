name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  research-provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - id: provenance
        name: Read pinned research revision
        shell: bash
        run: |
          commit="$(python3 -c 'import json; print(json.load(open("provenance/research-foundation.json"))["source_commit"])')"
          echo "source_commit=$commit" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          repository: Vaibhav701161/constrained-senstivity-lab
          ref: ${{ steps.provenance.outputs.source_commit }}
          path: research-source
      - name: Verify accepted research artifacts
        run: python3 scripts/verify-research-provenance.py provenance/research-foundation.json research-source

  local-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: npm ci
        working-directory: ui
      - run: npm audit --audit-level=high
        working-directory: ui
      - run: npm run check
        working-directory: ui
      - run: npm run build
        working-directory: ui
      - name: Verify embedded UI is current
        run: git diff --exit-code -- ui/dist
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui
      - run: ./scripts/test-local-ui-e2e.sh

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features --locked

  cross-platform:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo build --workspace --release --locked
      - run: cargo test --workspace --all-features --locked

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
      - run: cargo install mdbook --version 0.4.43 --locked
      - run: mdbook build

  public-site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm audit --audit-level=high
        working-directory: site
      - run: npm run build
        working-directory: site
      - run: npm test
        working-directory: site
      - run: npx playwright install --with-deps chromium
        working-directory: site
      - run: npm run test:e2e -- --project=chromium
        working-directory: site

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          # Security tooling needs CVSS 4 parsing, whose supported releases
          # require Rust 1.88. Product builds remain pinned to Rust 1.87.
          toolchain: "1.88.0"
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo install cargo-deny --version 0.20.2 --locked
      - name: Verify ignored advisory is unreachable
        shell: bash
        run: |
          if cargo tree --workspace --all-features --target all -i rkyv | grep -q '^rkyv '; then
            echo 'rkyv unexpectedly entered the compiled dependency graph' >&2
            exit 1
          fi
      # RUSTSEC-2026-0235 affects rkyv 0.7.46. Cargo.lock records it as an
      # unactivated rust_decimal option, while the reachability check above
      # ensures no workspace target compiles it.
      - run: cargo audit --ignore RUSTSEC-2026-0235
      - run: cargo deny check

  parser-fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: nightly
      - run: cargo install cargo-fuzz --version 0.13.2 --locked
      - run: cargo fuzz run strict_json -- -max_total_time=15
      - run: cargo fuzz run protocol_json -- -max_total_time=15
      - run: cargo fuzz run imported_artifact_json -- -max_total_time=15

  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: "1.87.0"
          components: rustfmt, clippy
      - run: cargo install mdbook --version 0.4.43 --locked
      - run: npm ci
        working-directory: ui
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: ui
      - uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - run: cargo install --path crates/structtrace-cli --locked
      - run: structtrace --help
      - run: structtrace doctor
      - run: structtrace demo support-ticket
      - run: structtrace demo invoice
      - run: structtrace demo research
      - run: structtrace replay --research-fixture
      - run: structtrace --project-root examples/recorded-output-comparison run
      - name: Deliberate regression with insufficient evidence returns 12
        shell: bash
        run: |
          set +e
          structtrace --quiet --project-root examples/recorded-output-comparison gate latest --verify replay
          code=$?
          test "$code" -eq 12
      - run: structtrace --project-root examples/python-callable run
      - run: structtrace --project-root examples/command run
      - run: structtrace --project-root examples/document-extraction run
      - run: structtrace --project-root examples/tool-calling run
      - name: Generate commit-bound acceptance evidence
        run: ./scripts/record-local-acceptance.sh acceptance/ci-release-audit.json
        env:
          STRUCTTRACE_ACCEPTANCE_BROWSER_ARGS: ""
      - name: Upload acceptance evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: structtrace-acceptance-${{ github.sha }}
          path: |
            acceptance/ci-release-audit.json
            target/local-acceptance/*.log
          if-no-files-found: error
