[book]
title = "StructTrace Documentation"
authors = ["Vaibhav Mittal"]
language = "en"
multilingual = false
src = "docs/src"

[build]
build-dir = "docs/book"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Vaibhav701161/structtrace"
edit-url-template = "https://github.com/Vaibhav701161/structtrace/edit/main/{path}"
additional-css = ["docs/theme/structtrace.css"]
no-section-label = false

[output.html.fold]
enable = true
level = 1
