<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">StructTrace product card</title>
  <desc id="desc">A technical comparison showing schema validity held while semantic correctness regressed.</desc>
  <rect width="1200" height="630" fill="#f1eee8"/>
  <path d="M0 74H1200M0 556H1200" stroke="#d9d3c8"/>
  <g transform="translate(58 22) scale(.62)" fill="none" stroke="#95502f" stroke-linecap="round" stroke-linejoin="round">
    <path d="M47 14H27C19.5 14 15 18.2 15 24c0 5.8 4.5 10 12 10h10c7.5 0 12 4.2 12 10s-4.5 10-12 10H17" stroke-width="5"/>
    <circle cx="47" cy="14" r="4.5" fill="#95502f" stroke="none"/><circle cx="32" cy="34" r="4.5" fill="#95502f" stroke="none"/><circle cx="17" cy="54" r="4.5" fill="#95502f" stroke="none"/>
  </g>
  <text x="108" y="48" fill="#242521" font-family="Arial, sans-serif" font-size="23" font-weight="700">StructTrace</text>
  <text x="58" y="154" fill="#95502f" font-family="monospace" font-size="15" font-weight="700" letter-spacing="2">STRUCTURED-OUTPUT RELEASE EVIDENCE</text>
  <text x="58" y="225" fill="#242521" font-family="Arial, sans-serif" font-size="55" font-weight="750" letter-spacing="-2">Your schema passed.</text>
  <text x="58" y="287" fill="#95502f" font-family="Arial, sans-serif" font-size="55" font-weight="750" letter-spacing="-2">Did the answer?</text>
  <g transform="translate(58 348)">
    <rect width="1084" height="145" rx="6" fill="#faf8f3" stroke="#d9d3c8"/>
    <path d="M361 0V145M722 0V145" stroke="#d9d3c8"/>
    <text x="24" y="35" fill="#63655e" font-family="monospace" font-size="14">SCHEMA VALID</text>
    <text x="24" y="76" fill="#242521" font-family="Arial, sans-serif" font-size="28" font-weight="700">10/12  →  12/12</text>
    <text x="24" y="111" fill="#176b55" font-family="monospace" font-size="15">+16.7 pp</text>
    <text x="385" y="35" fill="#63655e" font-family="monospace" font-size="14">SEMANTICALLY CORRECT</text>
    <text x="385" y="76" fill="#242521" font-family="Arial, sans-serif" font-size="28" font-weight="700">9/12  →  9/12</text>
    <text x="385" y="111" fill="#63655e" font-family="monospace" font-size="15">0.0 pp</text>
    <text x="746" y="35" fill="#63655e" font-family="monospace" font-size="14">VALID BUT WRONG</text>
    <text x="746" y="76" fill="#242521" font-family="Arial, sans-serif" font-size="28" font-weight="700">1/12  →  3/12</text>
    <text x="746" y="111" fill="#a53e35" font-family="monospace" font-size="15">+16.7 pp</text>
  </g>
  <text x="58" y="594" fill="#63655e" font-family="monospace" font-size="14">LOCAL-FIRST  ·  NO ACCOUNT  ·  NO TELEMETRY</text>
  <text x="1142" y="594" text-anchor="end" fill="#242521" font-family="monospace" font-size="14">structtrace.tech</text>
</svg>
