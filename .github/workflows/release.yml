name: Release binaries

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.87.0"
          targets: ${{ matrix.target }}
      - name: Install musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install --yes musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p structtrace-cli
      - name: Smoke-test static Linux binary
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          target/${{ matrix.target }}/release/structtrace --version
          target/${{ matrix.target }}/release/structtrace doctor --format json
      - name: Package Unix binary
        if: matrix.archive == 'tar.gz'
        shell: bash
        run: tar -czf structtrace-${{ matrix.target }}.tar.gz -C target/${{ matrix.target }}/release structtrace
      - name: Package Windows binary
        if: matrix.archive == 'zip'
        shell: pwsh
        run: Compress-Archive target/${{ matrix.target }}/release/structtrace.exe structtrace-${{ matrix.target }}.zip
      - name: Write SHA-256 checksum
        shell: bash
        run: |
          asset="structtrace-${{ matrix.target }}.${{ matrix.archive }}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: structtrace-${{ matrix.target }}.${{ matrix.archive }}
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            structtrace-${{ matrix.target }}.${{ matrix.archive }}
            structtrace-${{ matrix.target }}.${{ matrix.archive }}.sha256
